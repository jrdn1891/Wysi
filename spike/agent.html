<!doctype html>
<meta charset="utf-8">
<title>spike: edit agent</title>
<pre id="results">running…</pre>
<style>
  .frame img{display:none;width:100px;height:60px;object-fit:cover}
  .frame .ph{height:60px;background:#eee}
  .frame.filled img{display:block}
  .frame.filled .ph{display:none}
  .crop{display:block;width:100px;height:60px;object-fit:cover;object-position:0% 0%}
</style>
<div id="content">
  <h1 id="title">Original heading</h1>
  <p id="para">Original <strong id="bold">rich</strong> paragraph.</p>
  <p id="second">Second paragraph.</p>
  <img id="pic" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="placeholder" srcset="x.gif 1x" width="40" height="40">
  <picture id="shell">
    <source srcset="y.webp" type="image/webp">
    <img id="inner" src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" alt="art" width="40" height="40">
  </picture>
  <div id="cards">
    <div class="card"><h3>Card A</h3></div>
    <div class="card"><h3>Card B</h3></div>
    <div class="card"><h3>Card C</h3></div>
  </div>
  <figure class="frame" id="slot">
    <img id="slotimg" src="images/missing.png" alt="empty slot">
    <div class="ph" id="ph">images/missing.png</div>
  </figure>
  <img class="crop" id="crop" alt="wide">
</div>
<script>
const PNG_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
const results = [];
const ops = [];
const batches = [];
const got = { flushed: false };

function pngFile() {
  return new File([Uint8Array.from(atob(PNG_B64), c => c.charCodeAt(0))], 'new.png', { type: 'image/png' });
}

function dropOn(el) {
  const r = el.getBoundingClientRect();
  const dt = new DataTransfer();
  dt.items.add(pngFile());
  const at = { bubbles: true, cancelable: true, clientX: r.left + 5, clientY: r.top + 5, dataTransfer: dt };
  el.dispatchEvent(new DragEvent('dragover', at));
  el.dispatchEvent(new DragEvent('drop', at));
}

function check(name, ok, detail) {
  results.push({ name, ok, ...(detail ? { detail } : {}) });
}
function pathOf(node) {
  const path = [];
  for (let n = node; n !== document.body; n = n.parentNode) {
    path.unshift([...n.parentNode.childNodes].indexOf(n));
  }
  return path;
}
function tick() { return new Promise(r => setTimeout(r, 50)); }
function clickAt(el) {
  const r = el.getBoundingClientRect();
  el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: r.left + 5, clientY: r.top + 5 }));
}

addEventListener('message', (e) => {
  const m = e.data;
  if (!m || typeof m.type !== 'string') return;
  if (m.type === 'wy-ops') { batches.push(m.ops.length); ops.push(...m.ops); }
  if (m.type === 'wy-flushed') got.flushed = true;
});

async function run() {
  for (let i = 0; i < 40 && !got.flushed; i++) {
    postMessage({ type: 'wy-flush' }, '*');
    await tick();
  }
  check('agent answers flush handshake', got.flushed);
  got.flushed = false;

  const para = document.getElementById('para');
  clickAt(document.getElementById('bold'));
  await tick();
  check('click on inline child edits the block ancestor', para.isContentEditable);

  para.textContent = 'Rewritten by human';
  postMessage({ type: 'wy-flush' }, '*');
  await tick();
  check('flush commits the in-flight edit', got.flushed);
  const textOp = ops.find(o => o.kind === 'setHTML');
  check('commit emits setHTML op', !!textOp);
  check('setHTML path resolves to paragraph', !!textOp && JSON.stringify(textOp.path) === JSON.stringify(pathOf(para)));
  check('setHTML carries new content', !!textOp && textOp.html === 'Rewritten by human');
  check('contenteditable removed after commit', !para.isContentEditable);

  ops.length = 0;
  const title = document.getElementById('title');
  clickAt(title);
  await tick();
  title.textContent = 'should be discarded';
  title.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  await tick();
  check('escape restores original text', title.textContent === 'Original heading');
  check('escape emits no op', ops.length === 0);

  ops.length = 0;
  const second = document.getElementById('second');
  clickAt(second);
  await tick();
  second.textContent = 'Changed then blurred';
  second.dispatchEvent(new FocusEvent('focusout'));
  await tick();
  const blurOp = ops.find(o => o.kind === 'setHTML');
  check('focusout commits setHTML op', !!blurOp && blurOp.html === 'Changed then blurred');

  ops.length = 0;
  const img = document.getElementById('pic');
  const imgPath = pathOf(img);
  dropOn(img);
  for (let i = 0; i < 20 && !ops.length; i++) await tick();
  const srcOp = ops.find(o => o.kind === 'setAttr' && o.name === 'src');
  const srcsetOp = ops.find(o => o.kind === 'setAttr' && o.name === 'srcset');
  check('drop emits setAttr src op', !!srcOp);
  check('src op path resolves to img', !!srcOp && JSON.stringify(srcOp.path) === JSON.stringify(imgPath));
  check('src is a png data URI', !!srcOp && srcOp.value.startsWith('data:image/png'));
  check('srcset cleared alongside src', !!srcsetOp && srcsetOp.value === null);
  check('live img updated too', img.src.startsWith('data:image/png'));

  ops.length = 0;
  const shell = document.getElementById('shell');
  const shellPath = pathOf(shell);
  dropOn(document.getElementById('inner'));
  for (let i = 0; i < 20 && !ops.length; i++) await tick();
  const picOp = ops.find(o => o.kind === 'setHTML');
  check('picture drop emits setHTML on the picture', !!picOp && JSON.stringify(picOp.path) === JSON.stringify(shellPath));
  check('picture sources flattened away', !!picOp && !picOp.html.includes('<source') && picOp.html.includes('data:image/png'));
  check('live picture has no sources left', shell.querySelectorAll('source').length === 0);

  ops.length = 0;
  const cardB = document.querySelectorAll('#cards .card')[1];
  const bh = cardB.querySelector('h3');
  const br = bh.getBoundingClientRect();
  bh.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: br.left + 5, clientY: br.top + 5 }));
  await tick();
  const handle = document.querySelector('[data-wy-handle]');
  check('hovering a repeated unit shows the move handle', !!handle && handle.style.display !== 'none');
  const hr = handle.getBoundingClientRect();
  const cardA = document.querySelectorAll('#cards .card')[0];
  const ar = cardA.getBoundingClientRect();
  handle.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerId: 1, clientX: hr.left + 3, clientY: hr.top + 3 }));
  await tick();
  handle.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 1, clientX: ar.left + ar.width / 2, clientY: ar.top + 2 }));
  await tick();
  handle.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1, clientX: ar.left + ar.width / 2, clientY: ar.top + 2 }));
  await tick();
  check('handle drag emits move op', ops.some(o => o.kind === 'move'));
  const order = [...document.querySelectorAll('#cards h3')].map(h => h.textContent);
  check('card moved before its sibling', JSON.stringify(order) === JSON.stringify(['Card B', 'Card A', 'Card C']), order.join(','));
  check('drag ghost styling cleaned up', !cardB.getAttribute('style'));

  ops.length = 0;
  batches.length = 0;
  const slot = document.getElementById('slot');
  const slotImg = document.getElementById('slotimg');
  const slotPath = pathOf(slotImg);
  dropOn(document.getElementById('ph'));
  for (let i = 0; i < 20 && !ops.length; i++) await tick();
  const slotSrc = ops.find(o => o.kind === 'setAttr' && o.name === 'src');
  const classOp = ops.find(o => o.kind === 'setAttr' && o.name === 'class');
  check('drop on a placeholder fills the hidden img', !!slotSrc && JSON.stringify(slotSrc.path) === JSON.stringify(slotPath));
  check('reveal emits the unused state class', !!classOp && classOp.value === 'frame filled', classOp && classOp.value);
  check('state class op targets the slot container', !!classOp && JSON.stringify(classOp.path) === JSON.stringify(pathOf(slot)));
  check('filled img renders in edit mode', slotImg.getBoundingClientRect().height > 0);
  check('fill is a single op batch', batches.length === 1, JSON.stringify(batches));

  ops.length = 0;
  const crop = document.getElementById('crop');
  const wide = document.createElement('canvas');
  wide.width = 4;
  wide.height = 1;
  crop.src = wide.toDataURL('image/png');
  await crop.decode();
  const cr = crop.getBoundingClientRect();
  crop.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: cr.left + 5, clientY: cr.top + 5 }));
  await tick();
  check('hovering a cropped image marks it pannable', crop.hasAttribute('data-wy-pan'));
  crop.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerId: 2, clientX: cr.left + 80, clientY: cr.top + 30 }));
  document.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 2, clientX: cr.left + 10, clientY: cr.top + 30 }));
  document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 2, clientX: cr.left + 10, clientY: cr.top + 30 }));
  await tick();
  check('pan drag repositions the crop', crop.style.objectPosition === '50% 0%', crop.style.objectPosition);
  const panOp = ops.find(o => o.kind === 'setAttr' && o.name === 'style');
  check('pan emits setAttr style op', !!panOp && JSON.stringify(panOp.path) === JSON.stringify(pathOf(crop)));
  check('pan op carries object-position', !!panOp && panOp.value.includes('object-position'));

  ops.length = 0;
  const flat = document.getElementById('pic');
  const fr = flat.getBoundingClientRect();
  flat.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, clientX: fr.left + 5, clientY: fr.top + 5 }));
  await tick();
  check('uncropped image is not pannable', !flat.hasAttribute('data-wy-pan'));
  flat.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0, pointerId: 3, clientX: fr.left + 5, clientY: fr.top + 5 }));
  document.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 3, clientX: fr.left + 40, clientY: fr.top + 5 }));
  document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 3, clientX: fr.left + 40, clientY: fr.top + 5 }));
  await tick();
  check('dragging an uncropped image emits nothing', ops.length === 0, JSON.stringify(ops));

  const pass = results.every(r => r.ok);
  document.getElementById('results').textContent =
    'SPIKE-' + (pass ? 'PASS' : 'FAIL') + '\n' + JSON.stringify(results, null, 2);
  document.title = 'SPIKE-DONE';
}
run();
</script>
<script src="/Editor/wy-agent.js"></script>
